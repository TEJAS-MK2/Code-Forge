name: Bug report
description: Report a reproducible defect in Code Forge.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include passwords, API keys, private project source or other sensitive data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect and what you were trying to do.
      placeholder: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence of actions.
      placeholder: |
        1. Open ...
        2. Edit ...
        3. Choose ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Select the browser where you reproduced the issue.
      options:
        - Chrome
        - Chromium
        - Firefox
        - Safari
        - Edge
        - Other
        - Not sure
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Viewport size
      description: Include width and height if the issue is visual or responsive.
      placeholder: "390 × 844"
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant console errors or screenshots
      description: Share only sanitized diagnostics. Do not attach project backups that contain private content.
      render: text
    validations:
      required: false
