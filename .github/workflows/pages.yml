name: Validate and deploy Code Forge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep the default token read-only. Deployment-only permissions are granted to the deploy job.
permissions:
  contents: read

concurrency:
  group: code-forge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install build and test dependencies
        run: npm install --no-package-lock --no-fund
      - name: Verify required application, test and community files
        run: |
          test -s index.html
          test -s styles.css
          test -s core.js
          test -s app.js
          test -s src/editor.js
          test -s scripts/build.cjs
          test -s tests/editor.test.cjs
          test -s tests/core.persistence.test.cjs
          test -s tests/community.test.cjs
          test -s tests/browser.e2e.cjs
          test -s README.md
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s .github/dependabot.yml
          test -s .github/ISSUE_TEMPLATE/config.yml
          test -s .github/ISSUE_TEMPLATE/bug_report.yml
          test -s .github/ISSUE_TEMPLATE/feature_request.yml
          test -s .github/ISSUE_TEMPLATE/question.yml
      - name: Verify issue forms and preview security configuration
        run: |
          grep -q '^blank_issues_enabled: false$' .github/ISSUE_TEMPLATE/config.yml
          grep -q '^name:' .github/ISSUE_TEMPLATE/bug_report.yml
          grep -q '^body:' .github/ISSUE_TEMPLATE/bug_report.yml
          grep -q '^name:' .github/ISSUE_TEMPLATE/feature_request.yml
          grep -q '^body:' .github/ISSUE_TEMPLATE/feature_request.yml
          grep -q '^name:' .github/ISSUE_TEMPLATE/question.yml
          grep -q '^body:' .github/ISSUE_TEMPLATE/question.yml
          grep -q 'href="./styles.css"' index.html
          grep -q 'src="./editor.bundle.js"' index.html
          grep -q 'src="./core.js"' index.html
          grep -q 'src="./app.js"' index.html
          grep -q 'sandbox="allow-scripts"' index.html
          if grep -q 'allow-same-origin' index.html; then
            echo "Preview must not receive same-origin privileges"
            exit 1
          fi
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check app.js
          node --check scripts/build.cjs
          node --check tests/browser.e2e.cjs
      - name: Build the local-first static site
        run: npm run build
      - name: Verify production bundle
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/core.js
          test -s dist/app.js
          test -s dist/editor.bundle.js
          grep -q 'editor.bundle.js' dist/index.html
      - name: Run unit and repository regression tests
        run: npm test
      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end browser checks
        run: npm run test:e2e
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
