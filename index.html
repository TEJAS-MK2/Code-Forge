<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111311">
  <meta name="description" content="A quiet, local-first workspace for writing HTML, CSS and JavaScript with a live preview.">
  <title>Code Forge — Browser Editor</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">{ }</div>
      <div><div class="brand-title">Code Forge</div><div class="brand-subtitle">A small workspace for the web.</div></div>
    </div>
    <div class="top-actions">
      <button class="button button-quiet optional" id="importButton" type="button">Import project</button>
      <input class="file-input" id="importFile" type="file" accept=".json,application/json">
      <button class="button optional" id="exportProject" type="button">Backup JSON</button>
      <button class="button optional" id="exportHtml" type="button">Download HTML</button>
      <button class="button button-primary" id="run" type="button">Run <small>Ctrl ↵</small></button>
    </div>
  </header>
  <main>
    <div class="workspace" id="workspace">
      <section class="pane editor-pane" aria-label="Code editor">
        <div class="pane-heading">
          <div class="pane-title"><span class="pane-symbol" aria-hidden="true">⌘</span> Editor</div>
          <div class="tab-list" role="tablist" aria-label="Project files">
            <button class="tab" type="button" role="tab" data-lang="html" aria-selected="true">HTML</button>
            <button class="tab" type="button" role="tab" data-lang="css" aria-selected="false">CSS</button>
            <button class="tab" type="button" role="tab" data-lang="js" aria-selected="false">JS</button>
          </div>
        </div>
        <div class="editor-body">
          <div class="gutter" id="gutter" aria-hidden="true">1</div>
          <textarea id="editor" class="editor" aria-label="HTML editor" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" wrap="off"></textarea>
        </div>
        <div class="editor-footer">
          <span id="languageLabel">HTML document</span>
          <span class="button-group"><button class="button button-quiet" id="trim" type="button" title="Remove trailing whitespace">Trim</button><button class="button button-quiet" id="clear" type="button">Clear file</button></span>
        </div>
      </section>
      <div class="resize-handle" id="resizeHandle" role="separator" tabindex="0" aria-label="Resize editor and preview" aria-orientation="vertical"></div>
      <section class="pane preview-pane" aria-label="Live preview">
        <div class="pane-heading preview-heading">
          <div class="pane-title"><span class="pane-symbol" aria-hidden="true">◧</span> Preview</div>
          <span class="pane-meta" id="previewState">Ready</span>
        </div>
        <div class="preview-toolbar"><span>LOCAL PREVIEW <span aria-hidden="true">/</span> <span id="previewVersion">Run 1</span></span><span class="button-group"><button class="button" id="openPreview" type="button">Open separately ↗</button><button class="button" id="refresh" type="button" aria-label="Refresh preview">Refresh ↻</button></span></div>
        <iframe class="preview-frame" id="preview" title="Rendered code preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
      </section>
    </div>
    <section class="console" aria-label="JavaScript console">
      <div class="console-heading">
        <div class="console-title"><span class="pane-symbol" aria-hidden="true">&gt;_</span> Console <span class="console-count" id="consoleCount">0 entries</span></div>
        <button class="button button-quiet" id="clearConsole" type="button">Clear console</button>
      </div>
      <div class="console-output" id="consoleOutput" aria-live="polite" aria-relevant="additions text"><div class="console-empty" id="consoleEmpty">Console output and runtime errors will appear here.</div></div>
    </section>
  </main>
  <footer class="statusbar">
    <div class="status-left"><span><span class="status-dot"></span> Browser workspace</span><span id="cursor">Ln 1, Col 1</span><span id="charCount">0 chars</span><span id="saveState" class="status-saved">Saved on this device</span></div>
    <div class="status-right"><span>Local-first · No account</span><span>Ctrl/⌘ + Enter to run</span></div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
