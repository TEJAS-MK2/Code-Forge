<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><meta name="description" content="A private browser-based HTML, CSS and JavaScript playground."><title>Code Forge — Browser Editor</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c23;--panel2:#242832;--line:#303541;--text:#e8eaf0;--muted:#969eaf;--accent:#78e0bd;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,textarea{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px}button:hover{border-color:#697385}.primary{background:var(--accent);border-color:var(--accent);color:#10211b;font-weight:750}.topbar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:#15171d}.brand,.actions,.head,.tabs,.status{display:flex;align-items:center;gap:9px}.brand{min-width:0}.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#11211c;display:grid;place-items:center;font-weight:900}.brandname{font-weight:750}.sub{font-size:11px;color:var(--muted)}.actions{flex-wrap:wrap;justify-content:flex-end}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px;min-height:calc(100vh - 100px)}.pane{min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:420px}.head{justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line);min-height:50px}.title{font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#c8ced9}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px}.tab{font-size:12px;padding:7px 11px;border-color:transparent;background:transparent;color:var(--muted)}.tab[aria-selected=true]{background:#2b303a;color:var(--text);border-color:#3a414e}.editorwrap{position:relative;display:flex;flex:1;min-height:0;background:#14161c;overflow:hidden}.gutter{width:42px;flex-shrink:0;overflow:hidden;text-align:right;padding:15px 9px 20px 0;color:#626b7c;background:#171a21;border-right:1px solid #282d37;font:13px/1.65 ui-monospace,monospace;white-space:pre;user-select:none}.editor{resize:none;flex:1;width:0;border:0;outline:0;background:transparent;color:#dce3ef;padding:15px 13px;font:13px/1.65 ui-monospace,SFMono-Regular,monospace;tab-size:2;white-space:pre;overflow:auto;caret-color:var(--accent)}.editor:focus-visible{outline:0}.tools,.previewtools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.previewtools{border-top:0;border-bottom:1px solid var(--line)}.previewtools button,.tools button{font-size:12px}.preview{display:flex;flex-direction:column;flex:1;min-height:0;background:white}.preview iframe{border:0;width:100%;height:100%;min-height:320px;background:white;flex:1}.status{min-height:32px;justify-content:space-between;padding:7px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.saved{color:var(--accent)}.toast{position:fixed;left:50%;bottom:45px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#242a34;border:1px solid #424b59;padding:10px 15px;border-radius:9px;font-size:13px;transition:.18s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.topbar{padding:12px;align-items:flex-start}.sub{display:none}.actions{gap:5px}.actions button{font-size:12px;padding:7px 9px}.workspace{grid-template-columns:1fr;padding:9px;gap:10px}.pane{min-height:400px}.workspace .pane:first-child{min-height:450px}.preview iframe{min-height:330px}.status{padding:7px 10px}}@media(max-width:420px){.brandname{font-size:14px}.logo{width:30px;height:30px}.actions .optional{display:none}.tab{padding:7px 9px}}
</style></head><body><header class="topbar"><div class="brand"><div class="logo" aria-hidden="true">⌘</div><div><div class="brandname">Code Forge</div><div class="sub">Your code. Your browser. Your rules.</div></div></div><div class="actions"><button id="reset" class="optional">Reset</button><button id="export" class="optional">Export HTML</button><button id="run" class="primary">▶ Run code <small>Ctrl ↵</small></button></div></header>
<main class="workspace"><section class="pane" aria-label="Code editor"><div class="head"><div class="title"><span class="dot"></span>Editor</div><div class="tabs" role="tablist" aria-label="Language"><button class="tab" role="tab" data-lang="html" aria-selected="true">HTML</button><button class="tab" role="tab" data-lang="css" aria-selected="false">CSS</button><button class="tab" role="tab" data-lang="js" aria-selected="false">JS</button></div></div><div class="editorwrap"><div class="gutter" id="gutter" aria-hidden="true">1</div><textarea id="editor" class="editor" aria-label="Code input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" wrap="off"></textarea></div><div class="tools"><span id="hint">HTML document</span><span><button id="clear">Clear</button> <button id="format">Trim whitespace</button></span></div></section>
<section class="pane" aria-label="Live preview"><div class="head"><div class="title"><span class="dot"></span>Live preview</div><span id="state" style="font-size:11px;color:var(--muted)">Ready</span></div><div class="previewtools"><span>Output / <span id="filename">index.html</span></span><button id="refresh">Refresh ↻</button></div><div class="preview"><iframe id="frame" title="Code output preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div><div class="tools"><span>Runs in an isolated preview frame</span><button id="open">Open preview ↗</button></div></section></main>
<footer class="status"><span><span class="dot"></span>Browser workspace · <span id="cursor">Ln 1, Col 1</span> · <span id="saveState" class="saved">Local autosave on</span></span><span>No account required</span></footer><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var START={html:'<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>My first page</title>\n</head>\n<body>\n  <main class="card">\n    <p class="eyebrow">HELLO, WORLD</p>\n    <h1>Build something <span>brilliant.</span></h1>\n    <p>Edit HTML, CSS and JavaScript, then run your project.</p>\n    <button id="hello">Click me</button>\n    <p id="message" aria-live="polite"></p>\n  </main>\n</body>\n</html>',css:'* { box-sizing: border-box; }\nbody {\n  margin: 0;\n  min-height: 100vh;\n  display: grid;\n  place-items: center;\n  padding: 24px;\n  background: #101a24;\n  color: #f4f7fb;\n  font-family: system-ui, sans-serif;\n}\n.card { max-width: 560px; }\n.eyebrow { color: #8ce6c8; letter-spacing: .18em; font-size: 12px; font-weight: 700; }\nh1 { font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.02; letter-spacing: -.06em; }\nh1 span { color: #8ce6c8; }\np { color: #b8c5d4; line-height: 1.7; }\nbutton { padding: 12px 18px; border: 0; border-radius: 9px; background: #8ce6c8; color: #10231d; font-weight: 700; cursor: pointer; }',js:"document.querySelector('#hello')?.addEventListener('click', () => {\n  document.querySelector('#message').textContent = 'Nice work — your JavaScript is running!';\n});"};
var keys=['html','css','js'],active='html',code=load(),timer,toastTimer;
var editor=document.getElementById('editor'),gutter=document.getElementById('gutter'),frame=document.getElementById('frame');
function load(){try{var v=JSON.parse(localStorage.getItem('code-forge-project-v1'));if(v&&keys.every(function(k){return typeof v[k]==='string';}))return v;}catch(e){}return Object.assign({},START);}
function toast(s){var el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},2100);}
function lines(){var count=editor.value.split('\n').length;gutter.textContent=Array.from({length:count},function(_,i){return i+1;}).join('\n');gutter.scrollTop=editor.scrollTop;var before=editor.value.slice(0,editor.selectionStart);document.getElementById('cursor').textContent='Ln '+before.split('\n').length+', Col '+(before.length-before.lastIndexOf('\n'));}
function persist(){code[active]=editor.value;try{localStorage.setItem('code-forge-project-v1',JSON.stringify(code));document.getElementById('saveState').textContent='Saved locally';}catch(e){document.getElementById('saveState').textContent='Local storage unavailable';}}
function doc(){var h=code.html,c=code.css,j=code.js.replace(/<\/script/gi,'<\\/script');if(/<head(?:\s[^>]*)?>/i.test(h)){h=h.replace(/<\/head\s*>/i,'<style>\n'+c+'\n</style>\n</head>');if(/<\/body\s*>/i.test(h))h=h.replace(/<\/body\s*>/i,'<script>\n'+j+'\n<\/script>\n</body>');else h+='\n<script>\n'+j+'\n<\/script>';return h;}return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+c+'</style></head><body>'+h+'<script>'+j+'<\/script></body></html>';}
function run(show){code[active]=editor.value;persist();frame.srcdoc=doc();document.getElementById('state').textContent='Preview updated';if(show)toast('Preview updated');}
function switchTab(lang){code[active]=editor.value;active=lang;editor.value=code[active];document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.lang===active));});document.getElementById('hint').textContent=({html:'HTML document',css:'CSS stylesheet',js:'JavaScript'})[active];lines();editor.focus();}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){switchTab(t.dataset.lang);});});
editor.value=code[active];lines();run(false);
editor.addEventListener('input',function(){code[active]=editor.value;lines();document.getElementById('saveState').textContent='Saving…';clearTimeout(timer);timer=setTimeout(function(){run(false);},450);});
editor.addEventListener('scroll',function(){gutter.scrollTop=editor.scrollTop;});editor.addEventListener('click',lines);editor.addEventListener('keyup',lines);
editor.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run(true);}if(e.key==='Tab'){e.preventDefault();editor.setRangeText('  ',editor.selectionStart,editor.selectionEnd,'end');editor.dispatchEvent(new Event('input'));}});
document.getElementById('run').addEventListener('click',function(){run(true);});document.getElementById('refresh').addEventListener('click',function(){run(true);});
document.getElementById('clear').addEventListener('click',function(){editor.value='';code[active]='';lines();run(false);editor.focus();});
document.getElementById('reset').addEventListener('click',function(){if(!confirm('Restore the starter project? Your current local edits will be replaced.'))return;code=Object.assign({},START);editor.value=code[active];lines();run(false);toast('Starter project restored');});
document.getElementById('format').addEventListener('click',function(){editor.value=editor.value.split('\n').map(function(s){return s.replace(/[ \t]+$/,'');}).join('\n');code[active]=editor.value;lines();run(false);toast('Trailing whitespace removed');});
document.getElementById('export').addEventListener('click',function(){code[active]=editor.value;var blob=new Blob([doc()],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='code-forge-project.html';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('HTML file exported');});
document.getElementById('open').addEventListener('click',function(){var blob=new Blob([doc()],{type:'text/html'}),url=URL.createObjectURL(blob),w=window.open(url,'_blank','noopener');if(!w){URL.revokeObjectURL(url);toast('Pop-up blocked — use Export HTML instead');}else setTimeout(function(){URL.revokeObjectURL(url);},60000);});
window.addEventListener('beforeunload',function(){code[active]=editor.value;try{localStorage.setItem('code-forge-project-v1',JSON.stringify(code));}catch(e){}});
})();
</script></body></html>
